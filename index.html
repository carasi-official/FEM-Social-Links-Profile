<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

</head>
  <body>
    <main>
      <div class="cardContainer">
        <img class="profilePicture" src="./assets/images/avatar-jessica.jpeg" alt="profile picture">
        <p class="name">Jessica Randall</p>
        <p class="location">London, United Kingdom</p>
        <p class="job">"Front-end developer and avid reader."</p>

        <div class="socialLinks">
          <div class="button">GitHub</div>
          <div class="button">Frontend Mentor</div>
          <div class="button">LinkedIn</div>
          <div class="button">Twitter</div>
          <div class="button">Instagram</div>
        </div>
      </div>
    </main>

    <footer>
      <div class="credits">
        <p>Credits</p><div id="arrow">&#x27A4;</div>
      </div>
      <div class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
        Coded by <a href="https://github.com/carasi-official">Carasi</a>. Font by <a href="https://github.com/rsms/inter">The Inter Project Authors</a>.
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
